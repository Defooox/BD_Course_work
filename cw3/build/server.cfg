# Конфигурация сервера HockeyLeague
# Файл читается при старте; изменения применяются после перезапуска.

[server]
host = 0.0.0.0
port = 8080
threads = 4

[database]
# DSN-less connection string для ODBC Driver 17 for SQL Server
# Для доменной аутентификации: Trusted_Connection=yes
# Для SQL-аутентификации: UID=sa;PWD=secret
connection_string = Driver={ODBC Driver 17 for SQL Server};Server=localhost\\SQLEXPRESS;Database=HockeyLeague;Trusted_Connection=yes;

[cors]
# Разрешённые источники (через запятую, * = все)
allowed_origins = http://localhost:3000,http://localhost:5173

[log]
# debug | info | warn | error
level = info
